name: sonora
description: "Sonora - player de música com backend no Google Drive"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP para o backend (Apps Script Web App)
  http: ^1.2.2

  # Player de áudio
  just_audio: ^0.9.42

  # Persistência local (cache do App_ID, preferências)
  shared_preferences: ^2.3.2

  # Geração do App_ID (UUID no 1º uso)
  uuid: ^4.5.1

  # Info do dispositivo (nome do aparelho para a planilha de liberação)
  device_info_plus: ^11.1.1

  # Gerenciamento de estado
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
