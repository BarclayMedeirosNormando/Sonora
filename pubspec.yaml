name: sonora
description: "Sonora - player de música com backend no Google Drive"
publish_to: 'none'
version: 1.5.5+10

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP para o backend (Apps Script Web App)
  http: ^1.2.2

  # Player de áudio
  just_audio: ^0.9.42

  # Persistência local (cache do App_ID, preferências)
  shared_preferences: ^2.3.2

  # Geração do App_ID (UUID no 1º uso)
  uuid: ^4.5.1

  # Info do dispositivo (nome do aparelho para a planilha de liberação)
  device_info_plus: ^11.1.1

  # Gerenciamento de estado
  provider: ^6.1.2

  # Pasta local do app pra guardar mp3 baixados (ouvir offline)
  path_provider: ^2.1.4

  # Abrir o WhatsApp com mensagem pronta (tela "Pedir música")
  url_launcher: ^6.3.1

  # Tipografia (Poppins) pra dar cara mais profissional de app de musica
  google_fonts: ^6.2.1

  # Efeito de "esqueleto" pulsante enquanto pastas/albuns carregam
  shimmer: ^3.0.0

  # Cache em disco pras capas de album — evita rebaixar do Drive toda vez
  # que reabre uma pasta ja vista (ou reabre o app)
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Geração do ícone do app a partir de assets/icon/sonora_logo.png
  flutter_launcher_icons: ^0.14.3

  # Geração da splash screen a partir da mesma logo
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

# Config do flutter_launcher_icons — rodar com: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/sonora_logo.png"
  # Sem adaptive_icon_foreground porque a logo não tem versão com fundo
  # transparente — se separar símbolo e fundo depois, dá pra ativar o
  # adaptive icon "de verdade" (Android recorta o foreground numa safe
  # zone menor que a imagem toda, e isso cortaria a logo do jeito que
  # está agora).
  web:
    generate: true
    image_path: "assets/icon/sonora_logo.png"
    background_color: "#191F24"
    theme_color: "#191F24"
  windows:
    generate: true
    image_path: "assets/icon/sonora_logo.png"
  macos:
    generate: true
    image_path: "assets/icon/sonora_logo.png"

# Config do flutter_native_splash — rodar com: flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#191F24"
  image: assets/icon/sonora_logo.png
  color_dark: "#191F24"
  image_dark: assets/icon/sonora_logo.png
  android_12:
    color: "#191F24"
    image: assets/icon/sonora_logo.png
    color_dark: "#191F24"
    image_dark: assets/icon/sonora_logo.png
  web: false
